<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VicroBox — Fotocabinas & Eventos | Buenos Aires</title>
  <meta name="description" content="Fotocabinas, plataforma 360° y espejo mágico para eventos únicos en Buenos Aires. Casamentos, cumpleaños y eventos corporativos." />
  <link rel="stylesheet" href="vicrobox-styles.css" />
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 56" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="56" fill="#0C0A14"/>
      <rect x="8" y="14" width="27" height="28" rx="4" fill="#7C3AED" opacity="0.8"/>
      <rect x="13" y="19" width="17" height="14" rx="2" fill="#C026D3" opacity="0.6"/>
      <circle cx="58" cy="28" r="12" fill="none" stroke="#E040FB" stroke-width="2.5" opacity="0.8"/>
      <circle cx="58" cy="28" r="5" fill="#7C3AED" opacity="0.9"/>
      <line x1="58" y1="16" x2="58" y2="22" stroke="#E040FB" stroke-width="2" opacity="0.6"/>
    </svg>
  </template>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data (vanilla JS) -->
<script src="vicrobox-data.js"></script>

<!-- Components & Pages (Babel JSX — must load in order) -->
<script type="text/babel" src="vicrobox-components.jsx"></script>
<script type="text/babel" src="vicrobox-home.jsx"></script>
<script type="text/babel" src="vicrobox-services.jsx"></script>
<script type="text/babel" src="vicrobox-gallery.jsx"></script>
<script type="text/babel" src="vicrobox-cotizacion.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- App -->
<script type="text/babel">
const { useState, useCallback, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "acento": "Dorado",
  "fondo": "Normal"
}/*EDITMODE-END*/;

const ACCENT_MAP = {
  "Violeta": "oklch(62% 0.28 292)",
  "Dorado":  "oklch(80% 0.165 78)",
  "Rosa":    "oklch(67% 0.27 342)",
};

const BG_MAP = {
  "Normal":      "oklch(9% 0.025 280)",
  "Más oscuro":  "oklch(5.5% 0.018 280)",
};

function App() {
  const [route,  setRoute]  = useState('home');
  const [params, setParams] = useState({});
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const navigate = useCallback((newRoute, newParams = {}) => {
    setRoute(newRoute);
    setParams(newParams);
    window.scrollTo(0, 0);
  }, []);

  // Apply tweaks to CSS variables
  useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--violet', ACCENT_MAP[t.acento] || ACCENT_MAP['Violeta']);
    root.style.setProperty('--bg', BG_MAP[t.fondo] || BG_MAP['Normal']);
  }, [t.acento, t.fondo]);

  const {
    RouterCtx, NavBar, Footer, WhatsAppFAB,
    HomePage,
    ServiciosPage, DetalleServicioPage,
    GaleriaPage, DetalleGaleriaPage,
    CotizacionPage,
  } = window;

  return (
    <RouterCtx.Provider value={{ route, params, navigate }}>
      <NavBar />
      <div style={{ paddingTop: 68, minHeight: '100vh' }}>
        {route === 'home'          && <HomePage />}
        {route === 'servicios'     && <ServiciosPage />}
        {route === 'servicio'      && <DetalleServicioPage slug={params.slug} />}
        {route === 'galeria'       && <GaleriaPage />}
        {route === 'galeria-detalle' && <DetalleGaleriaPage slug={params.slug} />}
        {route === 'cotizar'       && <CotizacionPage />}
      </div>
      <Footer />
      <WhatsAppFAB />

      <TweaksPanel>
        <TweakSection label="Paleta" />
        <TweakRadio
          label="Color de acento"
          value={t.acento}
          options={['Violeta', 'Dorado', 'Rosa']}
          onChange={v => setTweak('acento', v)}
        />
        <TweakRadio
          label="Fondo"
          value={t.fondo}
          options={['Normal', 'Más oscuro']}
          onChange={v => setTweak('fondo', v)}
        />
      </TweaksPanel>
    </RouterCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
